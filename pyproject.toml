[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "flair-terminal"
version = "0.1.0"
description = "A compact Linux system showcase for the terminal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FLAIR contributors" }]
dependencies = [
  "rich>=13.7",
  "typer>=0.12",
  "psutil>=5.9",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
flair = "flair.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/flair"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

